table:
  name: organizations
  schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
  - name: watched_records
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: watched_records
          schema: public
  - name: notifications
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: notifications
          schema: public
  - name: audit_logs
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: audit_logs
          schema: public
  - name: usage_events
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: usage_events
          schema: public
  - name: workflow_db_writes
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflow_db_writes
          schema: public
object_relationships:
  - name: monthly_usage
    using:
      manual_configuration:
        remote_table:
          name: organization_monthly_usage
          schema: public
        column_mapping:
          id: organization_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - calls_used
        - calls_allowed
        - quota_period_start
        - created_at
        - updated_at
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
      filter:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
      check:
        members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
