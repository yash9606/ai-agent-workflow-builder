table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - position
        - name
        - type
        - config
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            members:
              user_id:
                _eq: X-Hasura-User-Id
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - workflow:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner
                          - editor
          - _or:
              - type:
                  _nin:
                    - db_write
                    - notify
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
      columns:
        - workflow_id
        - position
        - name
        - type
        - config
update_permissions:
  - role: user
    permission:
      columns:
        - position
        - name
        - type
        - config
      # Editors cannot target privileged steps (blocks demotion/config widen).
      filter:
        _and:
          - workflow:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner
                          - editor
          - _or:
              - type:
                  _nin:
                    - db_write
                    - notify
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
      check:
        _and:
          - workflow:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner
                          - editor
          - _or:
              - type:
                  _nin:
                    - db_write
                    - notify
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
delete_permissions:
  - role: user
    permission:
      # Editors may only delete non-privileged steps; owners may delete any.
      filter:
        _and:
          - workflow:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in:
                          - owner
                          - editor
          - _or:
              - type:
                  _nin:
                    - db_write
                    - notify
              - workflow:
                  organization:
                    members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
