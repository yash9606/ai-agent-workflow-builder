table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
array_relationships:
  - name: workflow_db_writes
    using:
      foreign_key_constraint_on:
        column: step_run_id
        table:
          name: workflow_db_writes
          schema: public
  - name: notifications
    using:
      foreign_key_constraint_on:
        column: step_run_id
        table:
          name: notifications
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - workflow_step_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - completed_at
        - created_at
      filter:
        workflow_run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
