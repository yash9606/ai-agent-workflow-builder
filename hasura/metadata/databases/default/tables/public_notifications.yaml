table:
  name: notifications
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - workflow_run_id
        - step_run_id
        - channel
        - destination
        - payload
        - status
        - error
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
event_triggers:
  - name: notifications_notify
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      num_retries: 3
      interval_sec: 10
      timeout_sec: 60
    webhook: '{{ACTION_BASE_URL}}/api/events/notify'
    headers:
      - name: X-Hasura-Event-Secret
        value_from_env: HASURA_EVENT_SECRET
